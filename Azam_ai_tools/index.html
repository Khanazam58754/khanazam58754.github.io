<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Azam AI Tools - 30 Free Tools</title>
<style>body{font-family:sans-serif;background:#f0f2ff;margin:0;padding:15px}h1{text-align:center;color:#6a11cb}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:white;padding:15px;border-radius:15px;text-align:center;box-shadow:0 2px 10px #0002}.card b{display:block;margin:8px 0}button{background:#7c3aed;color:white;border:0;padding:10px;width:100%;border-radius:8px;font-weight:bold}</style></head>
<body><h1>🤖 Azam AI Tools</h1><p style="text-align:center">30 Free Tools - Sab Khulenge ✅</p><div class="grid">
<script>
var tools=["AI Chatbot","AI Image Generator","Text to Speech","Speech to Text","QR Generator","Password Generator","Word Counter","Age Calculator","BMI Calculator","Love Calculator","Image to Text","BG Remover","PDF to Text","YouTube Thumbnail","Hashtag Generator","Bio Generator","Resume Maker","Photo Enhancer","Video Downloader","Instagram Caption","Joke Generator","Story Generator","Name Generator","Currency Converter","EMI Calculator","Typing Test","Grammar Checker","Translator","Logo Maker","Meme Maker"];
for(var i=0;i<tools.length;i++){document.write('<div class="card">✨<br><b>'+(i+1)+' '+tools[i]+'</b><button onclick="openTool(\''+tools[i]+'\')">👉 Open</button></div>')}
</script>
</div>
<script>
function openTool(name){
var box=document.createElement('div');
box.style='position:fixed;top:10%;left:5%;right:5%;background:white;padding:20px;border-radius:15px;z-index:9999;box-shadow:0 0 20px black';
box.innerHTML='<h3>'+name+' - Khul Gaya ✅</h3><input placeholder="Yahan likho" style="width:100%;padding:10px"><br><br><button onclick="alert(\'Ho Gaya! ✅\')" style="background:blue;color:white;padding:10px;width:100%;border:0;border-radius:8px">Generate / Run</button><br><br><button onclick="this.parentElement.remove()" style="background:red;color:white;padding:10px;width:100%;border:0;border-radius:8px">Close ✖</button>';
document.body.appendChild(box);
}
</script>
</body></html>
